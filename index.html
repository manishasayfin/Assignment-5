<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>
    <!-- Main Container with Background Image -->
    <div class="min-h-screen p-4" style="background-image: url('https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/chatbg.png'); background-size: cover;">
        
        <!-- Chat Container -->
        <div class="max-w-md mx-auto">
            
            <!-- Heading -->
            <div class="bg-[#323f4b] text-center p-4 rounded-t-lg">
                <h1 class="text-[#ffffff] text-xl font-medium">Rahul</h1>
            </div>

            <!-- Chat Messages -->
            <div class="space-y-4 mt-4">
                
                <!-- Message 1 - Blue Right -->
                <div class="flex justify-end">
                    <p class="bg-[#47a3f3] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        Hello Rahul, how are you?
                    </p>
                </div>

                <!-- Message 2 - Grey Left -->
                <div class="flex justify-start">
                    <p class="bg-[#52606d] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        Hi Varakumar, I am good. How about you?
                    </p>
                </div>

                <!-- Message 3 - Blue Right -->
                <div class="flex justify-end">
                    <p class="bg-[#47a3f3] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        I'm fine. I published my website recently
                    </p>
                </div>

                <!-- Message 4 - Grey Left -->
                <div class="flex justify-start">
                    <p class="bg-[#52606d] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        Oh great Varakumar! Can you send me the URL?
                    </p>
                </div>

                <!-- Message 5 - Blue Right -->
                <div class="flex justify-end">
                    <p class="bg-[#47a3f3] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        https://varakumar.ccbp.tech
                    </p>
                </div>

                <!-- Message 6 - Grey Left -->
                <div class="flex justify-start">
                    <p class="bg-[#52606d] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        Awesome Varakumar, where did you learn?
                    </p>
                </div>

                <!-- Message 7 - Blue Right -->
                <div class="flex justify-end">
                    <p class="bg-[#47a3f3] text-[#ffffff] p-3 rounded-lg max-w-xs">
                        NxtWave CCBP 4.0 Program
                    </p>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
