<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Page</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: #000 url('https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/chatbg.png') center/cover fixed no-repeat !important;
    }

    .chat-header {
      background-color: #323f4b;
      padding: 16px 20px;
      text-align: center;
    }

    .chat-header h1 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .chat-body {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent !important; /* IDHU DHAAN SAVIOUR */
    }

    .message {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      color: #ffffff;
      line-height: 1.5;
    }

    .message.sent {
      background-color: #47a3f3;
      align-self: flex-end;
      border-radius: 12px 12px 2px 12px;
    }

    .message.received {
      background-color: #52606d;
      align-self: flex-start;
      border-radius: 12px 12px 12px 2px;
    }
  </style>
</head>
<body>
  <div class="chat-header">
    <h1>RAHUL</h1>
  </div>
  <div class="chat-body">
    <div class="message sent">Hello Rahul, how are you?</div>
    <div class="message received">Hi Varakumar, I am good. How about you?</div>
    <div class="message sent">I'm fine. I published my website recently</div>
    <div class="message received">Oh great Varakumar! Can you send me the URL?</div>
    <div class="message sent">https://varakumar.ccbp.tech</div>
    <div class="message received">Awesome Varakumar, where did you learn?</div>
    <div class="message sent">NxtWave CCBP 4.0 Program</div>
  </div>
</body>
</html>
