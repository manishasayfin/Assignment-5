<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="w-full min-h-screen bg-cover bg-center" style="background-image: url('https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/chatbg.png')">
      
      <h2 class="bg-[#323f4b] text-[#ffffff] text-center p-4 font-medium text-lg">Rahul</h2>
      
      <div class="flex flex-col gap-3 p-4">
        
        <p class="bg-[#47a3f3] text-[#ffffff] rounded-xl p-3 self-end max-w-[80%]">
          Hello Rahul, how are you?
        </p>
        
        <p class="bg-[#52606d] text-[#ffffff] rounded-xl p-3 self-start max-w-[80%]">
          Hi Varakumar, I am good. How about you?
        </p>
        
        <p class="bg-[#47a3f3] text-[#ffffff] rounded-xl p-3 self-end max-w-[80%]">
          I'm fine. I published my website recently
        </p>
        
        <p class="bg-[#52606d] text-[#ffffff] rounded-xl p-3 self-start max-w-[80%]">
          Oh great Varakumar! Can you send me the URL?
        </p>
        
        <p class="bg-[#47a3f3] text-[#ffffff] rounded-xl p-3 self-end max-w-[80%] break-all">
          https://varakumar.ccbp.tech
        </p>
        
        <p class="bg-[#52606d] text-[#ffffff] rounded-xl p-3 self-start max-w-[80%]">
          Awesome Varakumar, where did you learn?
        </p>
        
        <p class="bg-[#47a3f3] text-[#ffffff] rounded-xl p-3 self-end max-w-[80%]">
          NxtWave CCBP 4.0 Program
        </p>
        
      </div>
    </div> 
  </body>
</html>
