<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Chat Page</title>
  </head>
  <body>
    <div class="bg-[#0d1418] min-h-screen p-4" style="background-image: url('doodles.jpg'); background-size: 350px; background-repeat: repeat;">
      
      <!-- Rahul Header -->
      <div class="bg-[#202c33] p-4 text-center text-white text-xl">
        Rahul
      </div>

      <!-- Message 1 - Right side -->
      <div class="flex justify-end mb-4 mt-4">
        <div class="bg-[#005c4b] text-white p-3 rounded-lg max-w-xs">
          Hello Rahul, how are you?
        </div>
      </div>

      <!-- Message 2 - Left side -->
      <div class="flex justify-start mb-4">
        <div class="bg-[#202c33] text-white p-3 rounded-lg max-w-xs">
          Hi Varun, I am good. How about you?
        </div>
      </div>

      <!-- Message 3 - Right side -->
      <div class="flex justify-end mb-4">
        <div class="bg-[#005c4b] text-white p-3 rounded-lg max-w-xs">
          I'm fine. I published my website recently
        </div>
      </div>

      <!-- Message 4 - Left side -->
      <div class="flex justify-start mb-4">
        <div class="bg-[#202c33] text-white p-3 rounded-lg max-w-xs">
          Oh great Varun! Can you send me the URL?
        </div>
      </div>

      <!-- Message 5 - Right side -->
      <div class="flex justify-end mb-4">
        <div class="bg-[#005c4b] text-white p-3 rounded-lg max-w-xs">
          https://varunm.github.io
        </div>
      </div>

      <!-- Message 6 - Left side -->
      <div class="flex justify-start mb-4">
        <div class="bg-[#202c33] text-white p-3 rounded-lg max-w-xs">
          Awesome Varun! Where did you learn?
        </div>
      </div>

      <!-- Message 7 - Right side -->
      <div class="flex justify-end mb-4">
        <div class="bg-[#005c4b] text-white p-3 rounded-lg max-w-xs">
          NxtWave CCBP 4.0 Certification
        </div>
      </div>

    </div>
  </body>
</html>
