<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #000000;
            background-image: url('https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/chatbg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .chat-header {
            background-color: #323f4b;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            position: sticky;
            top: 0;
        }
        
        .chat-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            max-width: 75%;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .sent {
            background-color: #47a3f3;
            align-self: flex-end;
            margin-left: auto;
        }
        
        .received {
            background-color: #52606d;
            align-self: flex-start;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="chat-header">Rahul</div>
    <div class="chat-container">
        <p class="message sent">Hello Rahul, how are you?</p>
        <p class="message received">Hi Varakumar, I am good. How about you?</p>
        <p class="message sent">I'm fine. I published my website recently</p>
        <p class="message received">Oh great Varakumar! Can you send me the URL?</p>
        <p class="message sent">https://varakumar.ccbp.tech</p>
        <p class="message received">Awesome Varakumar, where did you learn?</p>
        <p class="message sent">NxtWave CCBP 4.0 Program</p>
    </div>
</body>
</html>
