<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-image: url('https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/chatbg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .chat-header {
            background-color: #323f4b;
            padding: 18px;
            text-align: center;
        }

        .chat-header h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
        }

        .chat-messages {
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .message-sent {
            background-color: #47a3f3;
            color: #ffffff;
            font-size: 14px;
            padding: 12px;
            border-radius: 10px;
            border-bottom-right-radius: 2px;
            margin-bottom: 16px;
            max-width: 80%;
            align-self: flex-end;
            text-align: right;
        }

        .message-received {
            background-color: #52606d;
            color: #ffffff;
            font-size: 14px;
            padding: 12px;
            border-radius: 10px;
            border-bottom-left-radius: 2px;
            margin-bottom: 16px;
            max-width: 80%;
            align-self: flex-start;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h1>Rahul</h1>
    </div>

    <div class="chat-messages">
        <p class="message-sent">Hello Rahul, how are you?</p>
        <p class="message-received">Hi Varakumar, I am good. How about you?</p>
        <p class="message-sent">I'm fine. I published my website recently</p>
        <p class="message-received">Oh great Varakumar! Can you send me the URL?</p>
        <p class="message-sent">https://varakumar.ccbp.tech</p>
        <p class="message-received">Awesome Varakumar, where did you learn?</p>
        <p class="message-sent">NxtWave CCBP 4.0 Program</p>
    </div>
</body>
</html>
